name: HDSky Community Sign Tests

on:
  push:
    branches: [main]
    paths:
      - 'plugins.v3/hdskycommunitysign/**'
      - 'tests/v3/hdskycommunitysign/**'
      - '.github/workflows/hdskycommunitysign-tests.yml'
  pull_request:
    paths:
      - 'plugins.v3/hdskycommunitysign/**'
      - 'tests/v3/hdskycommunitysign/**'
      - '.github/workflows/hdskycommunitysign-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-contract:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install scheduler dependency
        run: python -m pip install 'APScheduler>=3.10,<4' 'pydantic>=2,<3'
      - name: Verify login and client check-in
        run: python -m unittest discover -s tests/v3/hdskycommunitysign -p 'test_*.py' -v

  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: plugins.v3/hdskycommunitysign/package-lock.json
      - run: npm ci
        working-directory: plugins.v3/hdskycommunitysign
      - run: npm test
        working-directory: plugins.v3/hdskycommunitysign
      - run: npm run build
        working-directory: plugins.v3/hdskycommunitysign
      - name: Verify committed frontend assets
        run: git diff --exit-code -- plugins.v3/hdskycommunitysign/dist
