name: Plugin Release
on:
  push:
    branches:
      - main
    paths:
      - 'package.json'
      - 'package.v2.json'
      - 'package.v3.json'
  workflow_dispatch:
    inputs:
      plugin_id:
        description: 'Optional plugin ID to package (for example HdskyCommunitySign)'
        required: false
        type: string

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y jq zip

      - name: Check plugin versions
        run: python .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json

      - name: Check federation plugin CSS
        run: python .github/scripts/check_federation_css.py

      - name: Build and release changed plugins
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_BASE_SHA: ${{ github.event.before }}
          SELECTED_PLUGIN_ID: ${{ inputs.plugin_id }}
        run: |
          set -euo pipefail

          # Track processed tags to avoid duplicates across package files.
          : > processed_tags.txt

          process_package() {
            local pkg_file="$1"
            [ -f "$pkg_file" ] || return 0

            echo "Processing $pkg_file"

            # Only entries explicitly marked release=true are packaged.
            mapfile -t entries < <(jq -r 'to_entries | map(select(.value.release == true)) | .[] | "\(.key)|\(.value.version)"' "$pkg_file")

            if [ "${#entries[@]}" -eq 0 ]; then
              echo "No plugins with release=true in $pkg_file"
              return 0
            fi

            for entry in "${entries[@]}"; do
              plugin_id="${entry%%|*}"
              plugin_version="${entry##*|}"
              plugin_id_lc="$(echo "$plugin_id" | tr '[:upper:]' '[:lower:]')"
              if [ -n "${SELECTED_PLUGIN_ID:-}" ] && [ "$plugin_id" != "$SELECTED_PLUGIN_ID" ]; then
                continue
              fi

              # A push publishes only changed market entries; manual runs retain full scan.
              # This avoids releasing unrelated plugins that were already pending in main.
              if [ "$GITHUB_EVENT_NAME" = "push" ] && git cat-file -e "${RELEASE_BASE_SHA}^{commit}" 2>/dev/null; then
                previous_entry="$(git show "${RELEASE_BASE_SHA}:${pkg_file}" 2>/dev/null | jq -cS --arg id "$plugin_id" '.[$id] // null')" || previous_entry=null
                current_entry="$(jq -cS --arg id "$plugin_id" '.[$id] // null' "$pkg_file")"
                if [ "$previous_entry" = "$current_entry" ]; then
                  echo "Unchanged index entry for $plugin_id, skip."
                  continue
                fi
              fi

              if ! plugin_dir="$(bash .github/scripts/select_plugin_release_dir.sh "$pkg_file" "$plugin_id_lc")"; then
                echo "Missing plugin directory for $plugin_id in $pkg_file" >&2
                exit 1
              fi

              tag="${plugin_id}_v${plugin_version}"
              asset="${plugin_id_lc}_v${plugin_version}.zip"
              release_notes="$(jq -r --arg plugin_id "$plugin_id" --arg version "v$plugin_version" '.[$plugin_id].history[$version] // empty' "$pkg_file")"
              if [ -z "$release_notes" ]; then
                release_notes="Automated release of $plugin_id $plugin_version"
              fi

              if grep -qxF "$tag" processed_tags.txt; then
                echo "Tag $tag already processed, skip."
                continue
              fi

              changed=1
              if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
                if git diff --quiet "$tag" -- "$plugin_dir" &&
                   gh release view "$tag" --json assets --jq '.assets[].name' | grep -qxF "$asset"; then
                  changed=0
                fi
              fi

              if [ "$changed" -eq 0 ]; then
                echo "No changes in $plugin_dir since $tag, skip packaging $plugin_id."
                if gh release view "$tag" >/dev/null 2>&1; then
                  gh release edit "$tag" --notes "$release_notes"
                fi
                echo "$tag" >> processed_tags.txt
                continue
              fi

              echo "Packing $plugin_id from $plugin_dir -> $asset"
              rm -f "$asset"
              (cd "$(dirname "$plugin_dir")" && zip -r "$GITHUB_WORKSPACE/$asset" "$(basename "$plugin_dir")" -x "*/__pycache__/*" -x "*.pyc" -x "*/node_modules/*") >/dev/null

              # Repair missing assets without deleting an existing release or tag.
              if gh release view "$tag" >/dev/null 2>&1; then
                gh release upload "$tag" "$asset" --clobber
                gh release edit "$tag" --notes "$release_notes"
                echo "$tag" >> processed_tags.txt
                continue
              fi

              git tag -d "$tag" >/dev/null 2>&1 || true

              echo "Creating release $tag"
              gh release create "$tag" "$asset" --title "$tag" --notes "$release_notes" --latest --target "$GITHUB_SHA"

              echo "$tag" >> processed_tags.txt
            done
          }

          process_package "package.v2.json"
          process_package "package.json"
          process_package "package.v3.json"
