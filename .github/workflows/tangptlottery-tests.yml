name: TangptLottery tests
on:
  push:
    paths:
      - 'plugins.v3/tangptlottery/**'
      - 'tests/v3/tangptlottery/**'
      - '.github/workflows/tangptlottery-tests.yml'
  pull_request:
    paths:
      - 'plugins.v3/tangptlottery/**'
      - 'tests/v3/tangptlottery/**'
      - '.github/workflows/tangptlottery-tests.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install 'requests~=2.34.2' 'apscheduler~=3.11.2' 'lxml~=6.1.2' 'pytest~=9.0.3'
      - run: python -m pytest -q tests/v3/tangptlottery
      - run: python -m compileall -q plugins.v3/tangptlottery
      - run: python .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json
