name: SiQiCleanBeach offline regressions

on:
  push:
    branches: [main]
    paths:
      - 'plugins.v3/siqicleanbeach/**'
      - 'tests/v3/siqicleanbeach/**'
      - 'package.v3.json'
      - '.github/workflows/siqicleanbeach-tests.yml'
  pull_request:
    paths:
      - 'plugins.v3/siqicleanbeach/**'
      - 'tests/v3/siqicleanbeach/**'
      - 'package.v3.json'
      - '.github/workflows/siqicleanbeach-tests.yml'

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - uses: actions/setup-node@v6
        with:
          node-version: '22'
          cache: npm
          cache-dependency-path: plugins.v3/siqicleanbeach/package-lock.json
      - run: python -m pip install pytest requests beautifulsoup4 apscheduler pydantic fastapi httpx
      - run: python -m pytest -q tests/v3/siqicleanbeach
      - run: npm ci --ignore-scripts --no-audit --no-fund
        working-directory: plugins.v3/siqicleanbeach
      - run: node --test tests/v3/siqicleanbeach/test_frontend.mjs
      - run: npm run build:web
        working-directory: plugins.v3/siqicleanbeach
      - run: python .github/scripts/check_federation_css.py
      - run: python .github/scripts/check_plugin_versions.py package.json package.v2.json package.v3.json
