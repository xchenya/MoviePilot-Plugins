name: HDSky Dice Login Regressions

on:
  push:
    branches: [main]
    paths:
      - 'plugins.v3/hdskydicebetnatural/**'
      - 'tests/v3/hdskydicebetnatural/**'
      - '.github/workflows/hdskydicebetnatural-tests.yml'
  pull_request:
    paths:
      - 'plugins.v3/hdskydicebetnatural/**'
      - 'tests/v3/hdskydicebetnatural/**'
      - '.github/workflows/hdskydicebetnatural-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  offline-regressions:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ['3.11', '3.14']
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - uses: actions/setup-node@v6
        with:
          node-version: '24'
      - name: Install host test dependencies
        run: python -m pip install pytest 'pydantic>=2,<3' beautifulsoup4 pytz 'APScheduler>=3.10,<4'
      - name: Verify plugin and authentication
        run: python -m pytest tests/v3/hdskydicebetnatural -q
      - name: Verify native configuration button interactions
        run: node --test tests/v3/hdskydicebetnatural/test_form.mjs
