name: HHClubButler mock regressions

on:
  push:
    branches: [main]
    paths:
      - 'plugins.v3/hhclubbutler/**'
      - 'tests/v3/hhclubbutler/**'
      - 'package.v3.json'
      - '.github/workflows/hhclubbutler-tests.yml'
  pull_request:
    paths:
      - 'plugins.v3/hhclubbutler/**'
      - 'tests/v3/hhclubbutler/**'
      - 'package.v3.json'
      - '.github/workflows/hhclubbutler-tests.yml'

permissions:
  contents: read

jobs:
  mock-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v6
        with:
          python-version: '3.14'
      - run: python -m pip install pytest==9.1.1 beautifulsoup4==4.15.0
      - run: python -m pytest -q tests/v3/hhclubbutler
      - run: node tests/v3/hhclubbutler/test_cross_seed_picker.js
      - run: node tests/v3/hhclubbutler/test_manager_state.js
